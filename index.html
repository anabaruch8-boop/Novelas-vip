<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#fff4f7">
  <title>Sweet Palace - Novelas VIP</title>

  <style>
    :root {
      --rosa: #ed4b70;
      --rosa-oscuro: #d9365f;
      --fondo: #fff5f8;
      --fondo-header: rgba(255, 255, 255, .88);
      --tarjeta: #ffffff;
      --texto: #2d1b22;
      --texto-suave: #7a5864;
      --borde: #f3d1dc;
      --input: #fffafb;
      --sombra: 0 20px 40px rgba(210, 80, 115, .08);
      --sombra-hover: 0 25px 50px rgba(210, 80, 115, .15);
      --fuente-lectura: 18px;
    }

    body.dark {
      --fondo: #130e10;
      --fondo-header: rgba(20, 15, 17, .9);
      --tarjeta: #1d1619;
      --texto: #f5e6ea;
      --texto-suave: #b898a3;
      --borde: #422d35;
      --input: #261e22;
      --rosa: #f27593;
      --rosa-oscuro: #ed4b70;
      --sombra: 0 20px 40px rgba(0, 0, 0, .35);
      --sombra-hover: 0 25px 50px rgba(0, 0, 0, .5);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { width: 100%; margin: 0; padding: 0; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    body { width: 100%; min-height: 100vh; margin: 0; padding: 0; background: var(--fondo); color: var(--texto); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; transition: background .3s, color .3s; }
    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; }

    /* HEADER MODERNO */
    .header { position: sticky; top: 0; z-index: 100; width: 100%; height: 70px; background: var(--fondo-header); border-bottom: 1px solid var(--borde); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .header-inner { width: min(100% - 32px, 1100px); height: 100%; margin: auto; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; color: var(--rosa); font-weight: 800; font-size: 21px; cursor: pointer; transition: opacity .2s; }
    .logo:hover { opacity: .85; }
    .logo-icon { font-size: 26px; }
    .theme { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--rosa); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 12px rgba(0,0,0,.03); transition: transform .2s; }
    .theme:hover { transform: scale(1.05); }

    .app { width: min(100% - 32px, 1100px); margin: auto; padding: 40px 0 80px; }
    .screen { display: none; width: 100%; animation: fadeIn .3s ease; }
    .screen.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* LOGIN */
    .login-wrapper { width: min(100%, 440px); margin: 60px auto 0; }
    .login-card { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 32px; padding: 44px 36px; box-shadow: var(--sombra); text-align: center; }
    .login-icon { font-size: 64px; margin-bottom: 16px; }
    .login-title { margin: 0 0 8px; color: var(--rosa); font-size: 32px; font-weight: 900; }
    .login-subtitle { margin: 0 auto 30px; color: var(--texto-suave); font-size: 15px; line-height: 1.6; }
    
    .password-box { position: relative; width: 100%; margin-bottom: 16px; }
    .password-box input { display: block; width: 100%; height: 56px; padding: 0 52px 0 20px; border: 1.5px solid var(--borde); border-radius: 18px; outline: none; background: var(--input); color: var(--texto); font-size: 16px; transition: all .2s; }
    .password-box input:focus { border-color: var(--rosa); box-shadow: 0 0 0 4px rgba(237, 75, 112, .12); }
    .show-password { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border: 0; background: transparent; cursor: pointer; border-radius: 12px; }

    .primary-btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; border: 0; border-radius: 18px; background: linear-gradient(135deg, var(--rosa), var(--rosa-oscuro)); color: white; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 10px 25px rgba(237, 75, 112, .3); transition: transform .2s, box-shadow .2s; }
    .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(237, 75, 112, .4); }
    .primary-btn:disabled { opacity: .6; cursor: wait; transform: none; }

    .loading { display: none; margin-top: 18px; color: var(--rosa); font-size: 14px; font-weight: 700; }
    .error { min-height: 24px; margin-top: 14px; color: #e53e5e; font-size: 14px; font-weight: 700; }

    /* BIBLIOTECA */
    .biblioteca-header { margin-bottom: 28px; }
    .etiqueta-vip { display: inline-block; padding: 5px 12px; background: rgba(237, 75, 112, .1); color: var(--rosa); border-radius: 20px; font-size: 12px; font-weight: 800; letter-spacing: 1.2px; margin-bottom: 10px; }
    .biblioteca-header h2 { margin: 0; font-size: 32px; color: var(--texto); font-weight: 900; }
    .biblioteca-header p { margin: 6px 0 0; color: var(--texto-suave); font-size: 15px; }

    .buscador { margin-bottom: 28px; }
    .buscador input { width: 100%; height: 52px; padding: 0 20px; border: 1.5px solid var(--borde); border-radius: 18px; background: var(--input); color: var(--texto); outline: none; transition: all .2s; }
    .buscador input:focus { border-color: var(--rosa); box-shadow: 0 0 0 4px rgba(237, 75, 112, .12); }

    .lista-novelas { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .novela-card { display: flex; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 24px; overflow: hidden; box-shadow: var(--sombra); transition: transform .25s, box-shadow .25s; }
    .novela-card:hover { transform: translateY(-4px); box-shadow: var(--sombra-hover); }

    .novela-portada { width: 130px; min-width: 130px; height: 180px; background: var(--input); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .novela-portada img { width: 100%; height: 100%; object-fit: cover; }
    .portada-placeholder { font-size: 42px; }

    .novela-info { flex: 1; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
    .novela-info h3 { margin: 0 0 6px; color: var(--texto); font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cantidad { color: var(--texto-suave); font-size: 13px; margin-bottom: 10px; }
    
    .tags-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; max-height: 50px; overflow: hidden; }
    .tag-badge { background: rgba(237, 75, 112, .08); color: var(--rosa); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }

    .leer-btn { width: 100%; min-height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--rosa); color: white; font-weight: 800; font-size: 13px; cursor: pointer; transition: background .2s; }
    .leer-btn:hover { background: var(--rosa-oscuro); }

    /* DETALLE DE NOVELA */
    .detalle-top { margin-bottom: 24px; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 1.5px solid var(--borde); border-radius: 16px; background: var(--tarjeta); color: var(--texto); cursor: pointer; font-weight: 700; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.02); transition: all .2s; }
    .back-btn:hover { border-color: var(--rosa); color: var(--rosa); }

    .detalle-card { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 32px; overflow: hidden; box-shadow: var(--sombra); padding: 40px; }
    .detalle-grid { display: grid; grid-template-columns: 260px 1fr; gap: 36px; align-items: start; }
    
    @media (max-width: 768px) {
      .detalle-grid { grid-template-columns: 1fr; text-align: center; justify-items: center; }
      .detalle-card { padding: 24px; }
    }

    .detalle-portada-box { width: 260px; height: 370px; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,.15); background: var(--input); }
    .detalle-portada-box img { width: 100%; height: 100%; object-fit: cover; }

    .detalle-datos { display: flex; flex-direction: column; width: 100%; min-width: 0; }
    .detalle-titulo { margin: 0 0 12px; color: var(--rosa); font-size: clamp(28px, 4vw, 38px); font-weight: 900; line-height: 1.2; }
    
    .detalle-tags-box { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .detalle-tag { background: rgba(237, 75, 112, .1); color: var(--rosa); padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; }

    .sinopsis-box { margin-bottom: 30px; padding: 22px; border: 1px solid var(--borde); border-radius: 20px; background: var(--input); text-align: left; }
    .sinopsis-box h3 { margin: 0 0 8px; color: var(--rosa); font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .sinopsis-box p { margin: 0; color: var(--texto); line-height: 1.8; font-size: 15px; white-space: pre-line; }

    .lista-capitulos-box h3 { margin: 0 0 16px; color: var(--texto); font-size: 20px; font-weight: 800; text-align: left; }
    .capitulos-scroll { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 4px; }
    
    .capitulo-item { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border: 1px solid var(--borde); border-radius: 16px; background: var(--input); transition: border-color .2s; }
    .capitulo-item:hover { border-color: var(--rosa); }
    .capitulo-nombre { color: var(--texto); font-weight: 700; font-size: 14px; text-align: left; overflow-wrap: anywhere; }
    .capitulo-btn { flex-shrink: 0; min-height: 38px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--rosa); color: white; cursor: pointer; font-weight: 700; font-size: 13px; transition: background .2s; }
    .capitulo-btn:hover { background: var(--rosa-oscuro); }

    /* LECTOR */
    .reader-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .reader-brand { color: var(--rosa); font-size: 13px; font-weight: 800; letter-spacing: 1px; }

    .reader-card { width: 100%; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 32px; overflow: hidden; box-shadow: var(--sombra); }
    .reader-heading { padding: 32px; text-align: center; border-bottom: 1px solid var(--borde); }
    .reader-heading h1 { margin: 0; color: var(--rosa); font-size: clamp(24px, 4vw, 32px); font-weight: 900; }
    
    .reader-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--borde); background: var(--input); gap: 15px; flex-wrap: wrap; }
    .chapter-select select { height: 44px; padding: 0 16px; border: 1px solid var(--borde); border-radius: 14px; background: var(--tarjeta); color: var(--texto); outline: none; font-weight: 600; cursor: pointer; max-width: 300px; width: 100%; }
    
    .reader-controls { display: flex; gap: 6px; }
    .reader-controls button { width: 38px; height: 38px; border: 1px solid var(--borde); border-radius: 12px; background: var(--tarjeta); color: var(--rosa); cursor: pointer; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .reader-controls button:hover { border-color: var(--rosa); }

    .progress-wrap { padding: 12px 24px 0; }
    .progress-bar { width: 100%; height: 4px; overflow: hidden; border-radius: 10px; background: rgba(237, 75, 112, .12); }
    #progress { width: 0%; height: 100%; background: var(--rosa); transition: width .1s linear; }
    .progress-text { padding-top: 6px; text-align: center; color: var(--texto-suave); font-size: 11px; font-weight: 700; }

    .chapter-content { width: 100%; max-width: 800px; margin: auto; padding: 40px 48px; color: var(--texto); font-family: Georgia, serif; font-size: var(--fuente-lectura); line-height: 2; overflow-wrap: anywhere; user-select: none !important; -webkit-user-select: none !important; }
    .chapter-content p { margin: 0 0 24px; text-align: justify; }

    .reader-navigation { display: flex; justify-content: space-between; gap: 16px; padding: 24px 32px; border-top: 1px solid var(--borde); background: var(--input); }
    .nav-chapter-btn { min-height: 46px; padding: 0 24px; border: 1.5px solid var(--borde); border-radius: 15px; background: var(--tarjeta); color: var(--rosa); font-weight: 800; cursor: pointer; transition: all .2s; }
    .nav-chapter-btn:hover { border-color: var(--rosa); background: var(--rosa); color: white; }

    #topButton { position: fixed; right: 24px; bottom: 24px; z-index: 200; display: none; width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--rosa); color: white; font-size: 18px; cursor: pointer; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(237, 75, 112, .4); }

    .empty { text-align: center; padding: 50px 20px; color: var(--texto-suave); font-size: 16px; background: var(--tarjeta); border-radius: 24px; border: 1px solid var(--borde); grid-column: 1 / -1; }

    @media (max-width: 600px) {
      .app { width: calc(100% - 20px); padding: 20px 0 60px; }
      .chapter-content { padding: 24px 20px; font-size: 19px !important; }
      .reader-toolbar { padding: 12px 16px; }
      .reader-navigation { padding: 16px 20px; }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo" onclick="volverBiblioteca()" title="Ir a la biblioteca">
        <span class="logo-icon">🍓</span>
        <span>Sweet Palace</span>
      </div>
      <button class="theme" id="themeButton" type="button" onclick="toggleTheme()">🌙</button>
    </div>
  </header>

  <main class="app">
    <!-- LOGIN -->
    <section id="loginScreen" class="screen active">
      <div class="login-wrapper">
        <div class="login-card">
          <div class="login-icon">🍓</div>
          <h1 class="login-title">Novelas VIP</h1>
          <p class="login-subtitle">Introduce tu contraseña exclusiva para acceder a Sweet Palace.</p>
          <div class="password-box">
            <input type="password" id="password" placeholder="Contraseña VIP" autocomplete="current-password" autocapitalize="none" spellcheck="false">
            <button type="button" class="show-password" id="showPassword" onclick="mostrarPassword()">🔒</button>
          </div>
          <button type="button" class="primary-btn" id="loginButton" onclick="entrar()">ACCEDER AHORA</button>
          <div id="loading" class="loading">⏳ Verificando acceso...</div>
          <div id="error" class="error"></div>
        </div>
      </div>
    </section>

    <!-- BIBLIOTECA -->
    <section id="libraryScreen" class="screen">
      <div class="biblioteca-header">
        <span class="etiqueta-vip">ÁREA EXCLUSIVA</span>
        <h2>Mi Biblioteca</h2>
        <p>Selecciona una obra para comenzar tu lectura.</p>
      </div>
      <div class="buscador">
        <input type="search" id="buscarNovela" placeholder="🔎 Buscar por título o género..." autocomplete="off">
      </div>
      <div id="listaNovelas" class="lista-novelas"></div>
    </section>

    <!-- DETALLE -->
    <section id="novelaScreen" class="screen">
      <div class="detalle-top">
        <button type="button" class="back-btn" onclick="volverBiblioteca()">← Volver a la biblioteca</button>
      </div>
      <article class="detalle-card">
        <div class="detalle-grid">
          <div id="detallePortada" class="detalle-portada-box"></div>
          <div class="detalle-datos">
            <h1 id="detalleTitulo" class="detalle-titulo">Novela</h1>
            <div id="detalleTags" class="detalle-tags-box"></div>
            <div class="sinopsis-box">
              <h3>✨ Sinopsis</h3>
              <p id="detalleSinopsis"></p>
            </div>
            <div class="lista-capitulos-box">
              <h3>Capítulos disponibles</h3>
              <div id="listaCapitulos" class="capitulos-scroll"></div>
            </div>
          </div>
        </div>
      </article>
    </section>

    <!-- LECTOR -->
    <section id="readerScreen" class="screen">
      <div class="reader-top">
        <button type="button" class="back-btn" onclick="volverDetalleNovela()">← Regresar</button>
        <div id="readerBrand" class="reader-brand">SWEET PALACE · VIP</div>
      </div>
      <article class="reader-card">
        <div class="reader-heading">
          <h1 id="chapterTitle">Capítulo</h1>
        </div>
        <div class="reader-toolbar">
          <div class="chapter-select">
            <select id="chapterSelect" onchange="seleccionarCapitulo()"></select>
          </div>
          <div class="reader-controls">
            <button type="button" onclick="cambiarTamano(-1)" title="Reducir fuente">A−</button>
            <button type="button" onclick="tamanoNormal()" title="Tamaño original">A</button>
            <button type="button" onclick="cambiarTamano(1)" title="Aumentar fuente">A+</button>
          </div>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar">
            <div id="progress"></div>
          </div>
          <div id="progressText" class="progress-text">0% leído</div>
        </div>
        <div id="chapterContent" class="chapter-content"></div>
        <div class="reader-navigation">
          <button type="button" class="nav-chapter-btn" onclick="cambiarCapitulo(-1)">← Capítulo anterior</button>
          <button type="button" class="nav-chapter-btn" onclick="cambiarCapitulo(1)">Siguiente capítulo →</button>
        </div>
      </article>
    </section>
  </main>

  <button id="topButton" type="button" onclick="volverArriba()">↑</button>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbz6AdjUyacLTLh1rZpxn_5rtCIsXz7E7bomG97l6lFBJVox1-nXJlVRfcfwBWuqm5Co3g/exec";

    let novelas = [];
    let novelaActual = null;
    let capituloActual = 0;
    let tamanoTexto = 18;

    const loginScreen = document.getElementById('loginScreen');
    const libraryScreen = document.getElementById('libraryScreen');
    const novelaScreen = document.getElementById('novelaScreen');
    const readerScreen = document.getElementById('readerScreen');

    function mostrarPantalla(pantalla) {
      loginScreen.classList.remove('active');
      libraryScreen.classList.remove('active');
      novelaScreen.classList.remove('active');
      readerScreen.classList.remove('active');
      pantalla.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function mostrarPassword() {
      const input = document.getElementById('password');
      const boton = document.getElementById('showPassword');
      if (input.type === 'password') {
        input.type = 'text';
        boton.textContent = '🗝️';
      } else {
        input.type = 'password';
        boton.textContent = '🔒';
      }
    }

    function entrar() {
      const passwordInput = document.getElementById('password');
      const password = passwordInput.value.trim();
      const error = document.getElementById('error');
      const loading = document.getElementById('loading');
      const button = document.getElementById('loginButton');

      error.textContent = '';
      if (!password) {
        error.textContent = '⚠️ Introduce la contraseña.';
        return;
      }

      loading.style.display = 'block';
      loading.textContent = '⏳ Verificando acceso...';
      button.disabled = true;

      fetch(`${URL_API}?action=login&password=${encodeURIComponent(password)}`)
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            loading.style.display = 'none';
            button.disabled = false;
            error.textContent = '❌ Contraseña incorrecta.';
            passwordInput.value = '';
            passwordInput.focus();
            return;
          }
          guardarPasswordSesion(password);
          cargarContenidoVIP(password);
        })
        .catch(err => {
          loading.style.display = 'none';
          button.disabled = false;
          error.textContent = '❌ Error de conexión con el servidor.';
          console.error(err);
        });
    }

    function guardarPasswordSesion(password) {
      try { sessionStorage.setItem('sweetPalacePassword', password); } catch (e) {}
    }

    function recuperarPasswordSesion() {
      try { return sessionStorage.getItem('sweetPalacePassword'); } catch (e) { return null; }
    }

    function cargarContenidoVIP(password) {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const button = document.getElementById('loginButton');

      loading.style.display = 'block';
      loading.textContent = '⏳ Cargando biblioteca VIP...';
      if (button) button.disabled = true;

      fetch(`${URL_API}?action=obtenerCapitulos&password=${encodeURIComponent(password)}`)
        .then(res => res.json())
        .then(lista => {
          loading.style.display = 'none';
          if (button) button.disabled = false;
          
          if (!lista || lista.error || lista.length === 0) {
            error.textContent = lista.error || '⚠️ No hay novelas disponibles.';
            return;
          }
          novelas = lista;
          construirBiblioteca();
          cargarTamano();
          mostrarPantalla(libraryScreen);
        })
        .catch(err => {
          loading.style.display = 'none';
          if (button) button.disabled = false;
          error.textContent = '❌ No se pudieron cargar las novelas.';
          console.error(err);
        });
    }

    function construirBiblioteca(filtro = '') {
      const contenedor = document.getElementById('listaNovelas');
      contenedor.innerHTML = '';

      const texto = String(filtro).toLowerCase().trim();
      const lista = novelas.filter(function(novela) {
        const coincideTitulo = novela.nombre.toLowerCase().includes(texto);
        const coincideTag = novela.tags && novela.tags.some(t => t.toLowerCase().includes(texto));
        return coincideTitulo || coincideTag;
      });

      if (lista.length === 0) {
        contenedor.innerHTML = `<div class="empty">🔎<br><br>No encontramos novelas con ese criterio.</div>`;
        return;
      }

      lista.forEach(function(novela) {
        const tarjeta = document.createElement('article');
        tarjeta.className = 'novela-card';

        const portada = document.createElement('div');
        portada.className = 'novela-portada';

        if (novela.portada) {
          const img = document.createElement('img');
          img.src = convertirImagenDrive(novela.portada);
          img.alt = novela.nombre;
          img.loading = 'lazy';
          img.onerror = function() {
            portada.innerHTML = '<div class="portada-placeholder">📖</div>';
          };
          portada.appendChild(img);
        } else {
          portada.innerHTML = '<div class="portada-placeholder">📖</div>';
        }

        const info = document.createElement('div');
        info.className = 'novela-info';

        const topInfo = document.createElement('div');
        const titulo = document.createElement('h3');
        titulo.textContent = novela.nombre;
        
        const cantidad = document.createElement('div');
        cantidad.className = 'cantidad';
        cantidad.textContent = novela.capitulos.length + (novela.capitulos.length === 1 ? ' capítulo' : ' capítulos');

        topInfo.appendChild(titulo);
        topInfo.appendChild(cantidad);

        if (novela.tags && novela.tags.length > 0) {
          const tagsDiv = document.createElement('div');
          tagsDiv.className = 'tags-container';
          novela.tags.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag-badge';
            span.textContent = tag;
            tagsDiv.appendChild(span);
          });
          topInfo.appendChild(tagsDiv);
        }

        const boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'leer-btn';
        boton.textContent = 'Leer ahora →';
        boton.onclick = function() { abrirNovela(novela); };

        info.appendChild(topInfo);
        info.appendChild(boton);

        tarjeta.appendChild(portada);
        tarjeta.appendChild(info);
        contenedor.appendChild(tarjeta);
      });
    }

    function abrirNovela(novela) {
      novelaActual = novela;
      capituloActual = 0;
      mostrarDetalleNovela();
      mostrarPantalla(novelaScreen);
    }

    function mostrarDetalleNovela() {
      if (!novelaActual) return;

      document.getElementById('detalleTitulo').textContent = novelaActual.nombre;
      document.getElementById('detalleSinopsis').textContent = novelaActual.sinopsis || 'Esta obra aún no cuenta con una sinopsis.';

      const tagsContainer = document.getElementById('detalleTags');
      tagsContainer.innerHTML = '';
      if (novelaActual.tags && novelaActual.tags.length > 0) {
        novelaActual.tags.forEach(tag => {
          const tagSpan = document.createElement('span');
          tagSpan.className = 'detalle-tag';
          tagSpan.textContent = '🏷️ ' + tag;
          tagsContainer.appendChild(tagSpan);
        });
      }

      const portada = document.getElementById('detallePortada');
      portada.innerHTML = '';

      if (novelaActual.portada) {
        const img = document.createElement('img');
        img.src = convertirImagenDrive(novelaActual.portada);
        img.alt = novelaActual.nombre;
        portada.appendChild(img);
      } else {
        portada.innerHTML = '<div class="portada-placeholder" style="height:100%; display:flex; align-items:center; justify-content:center;">📖</div>';
      }

      const lista = document.getElementById('listaCapitulos');
      lista.innerHTML = '';

      novelaActual.capitulos.forEach(function(capitulo, index) {
        const item = document.createElement('div');
        item.className = 'capitulo-item';

        const nombre = document.createElement('div');
        nombre.className = 'capitulo-nombre';
        nombre.textContent = capitulo.titulo;

        const boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'capitulo-btn';
        boton.textContent = 'Leer';
        boton.onclick = function() { abrirCapitulo(index); };

        item.appendChild(nombre);
        item.appendChild(boton);
        lista.appendChild(item);
      });
    }

    function volverBiblioteca() {
      novelaActual = null;
      mostrarPantalla(libraryScreen);
    }

    function abrirCapitulo(index) {
      if (!novelaActual) return;
      capituloActual = index;
      construirSelector();
      mostrarCapitulo();
      mostrarPantalla(readerScreen);
    }

    function volverDetalleNovela() {
      mostrarDetalleNovela();
      mostrarPantalla(novelaScreen);
    }

    function construirSelector() {
      const selector = document.getElementById('chapterSelect');
      selector.innerHTML = '';
      if (!novelaActual) return;

      novelaActual.capitulos.forEach(function(capitulo, index) {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = capitulo.titulo;
        selector.appendChild(option);
      });
      selector.value = capituloActual;
    }

    function mostrarCapitulo() {
      if (!novelaActual || !novelaActual.capitulos.length) return;

      const capitulo = novelaActual.capitulos[capituloActual];

      document.getElementById('chapterTitle').textContent = capitulo.titulo;
      document.getElementById('readerBrand').textContent = novelaActual.nombre.toUpperCase() + ' · VIP';

      const contenido = document.getElementById('chapterContent');
      contenido.innerHTML = '';

      const parrafos = String(capitulo.texto || '').split(/\n\s*\n|\n+/);
      parrafos.forEach(function(texto) {
        const limpio = texto.trim();
        if (!limpio) return;
        const p = document.createElement('p');
        p.textContent = limpio;
        contenido.appendChild(p);
      });

      document.getElementById('chapterSelect').value = capituloActual;
      aplicarTamano();
      actualizarProgreso();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function seleccionarCapitulo() {
      const selector = document.getElementById('chapterSelect');
      capituloActual = parseInt(selector.value, 10);
      mostrarCapitulo();
    }

    function cambiarCapitulo(direccion) {
      if (!novelaActual) return;
      const nuevo = capituloActual + direccion;
      if (nuevo < 0 || nuevo >= novelaActual.capitulos.length) return;
      capituloActual = nuevo;
      mostrarCapitulo();
    }

    function convertirImagenDrive(url) {
      if (!url) return '';
      url = String(url).trim();
      let match = url.match(/drive\.google\.com\/file\/d\/([^\/?]+)/);
      if (match && match[1]) return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(match[1]) + '&sz=w1000';
      match = url.match(/drive\.google\.com\/open\?id=([^&]+)/);
      if (match && match[1]) return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(match[1]) + '&sz=w1000';
      match = url.match(/drive\.google\.com\/uc\?id=([^&]+)/);
      if (match && match[1]) return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(match[1]) + '&sz=w1000';
      return url;
    }

    function cambiarTamano(cambio) {
      tamanoTexto += cambio;
      tamanoTexto = Math.max(14, Math.min(28, tamanoTexto));
      aplicarTamano();
      try { localStorage.setItem('sweetPalaceTamano', tamanoTexto); } catch (e) {}
    }

    function tamanoNormal() {
      tamanoTexto = 18;
      aplicarTamano();
      try { localStorage.setItem('sweetPalaceTamano', tamanoTexto); } catch (e) {}
    }

    function aplicarTamano() {
      document.documentElement.style.setProperty('--fuente-lectura', tamanoTexto + 'px');
    }

    function cargarTamano() {
      try {
        const guardado = localStorage.getItem('sweetPalaceTamano');
        if (guardado) {
          const numero = parseInt(guardado, 10);
          if (numero >= 14 && numero <= 28) tamanoTexto = numero;
        }
      } catch (e) {}
      aplicarTamano();
    }

    function actualizarProgreso() {
      const contenido = document.getElementById('chapterContent');
      const barra = document.getElementById('progress');
      const texto = document.getElementById('progressText');
      if (!contenido || !barra || !texto) return;

      const rect = contenido.getBoundingClientRect();
      const inicio = window.scrollY + rect.top;
      const altura = contenido.offsetHeight;
      const final = inicio + altura;
      const posicion = window.scrollY + window.innerHeight;
      const recorrido = final - inicio;

      let porcentaje = 0;
      if (recorrido > 0) {
        porcentaje = ((posicion - inicio) / recorrido) * 100;
      }
      porcentaje = Math.max(0, Math.min(100, porcentaje));

      barra.style.width = porcentaje + '%';
      texto.textContent = Math.round(porcentaje) + '% leído';
    }

    function volverArriba() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function controlarBotonArriba() {
      const boton = document.getElementById('topButton');
      if (!boton) return;
      if (window.scrollY > 350) { boton.style.display = 'flex'; } else { boton.style.display = 'none'; }
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const oscuro = document.body.classList.contains('dark');
      document.getElementById('themeButton').textContent = oscuro ? '☀️' : '🌙';
      try { localStorage.setItem('sweetPalaceTema', oscuro ? 'oscuro' : 'claro'); } catch (e) {}
    }

    function cargarTema() {
      try {
        const tema = localStorage.getItem('sweetPalaceTema');
        if (tema === 'oscuro') {
          document.body.classList.add('dark');
          const btn = document.getElementById('themeButton');
          if (btn) btn.textContent = '☀️';
        }
      } catch (e) {}
    }

    const inputBuscar = document.getElementById('buscarNovela');
    if (inputBuscar) {
      inputBuscar.addEventListener('input', function() {
        construirBiblioteca(this.value);
      });
    }

    const inputPass = document.getElementById('password');
    if (inputPass) {
      inputPass.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          entrar();
        }
      });
    }

    window.addEventListener('scroll', function() {
      if (readerScreen && readerScreen.classList.contains('active')) { actualizarProgreso(); }
      controlarBotonArriba();
    }, { passive: true });

    function iniciarSesionGuardada() {
      const password = recuperarPasswordSesion();
      if (!password) return;

      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'block';
        loading.textContent = '⏳ Restaurando sesión...';
      }

      fetch(`${URL_API}?action=login&password=${encodeURIComponent(password)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            cargarContenidoVIP(password);
          } else {
            sessionStorage.removeItem('sweetPalacePassword');
            if (loading) loading.style.display = 'none';
          }
        })
        .catch(() => {
          sessionStorage.removeItem('sweetPalacePassword');
          if (loading) loading.style.display = 'none';
        });
    }

    // PROTECCIÓN ANTI-COPY
    document.addEventListener('selectstart', function(e) {
      if (e.target.closest('.chapter-content')) { e.preventDefault(); return false; }
    });
    document.addEventListener('copy', function(e) {
      if (e.target.closest('.chapter-content')) { e.preventDefault(); alert('📚 Contenido protegido contra copia.'); return false; }
    });
    document.addEventListener('contextmenu', function(e) {
      if (e.target.closest('.chapter-content')) { e.preventDefault(); alert('📚 Contenido protegido.'); return false; }
    });
    document.addEventListener('keydown', function(e) {
      if (!e.target.closest('.chapter-content')) return;
      const teclas = ['c', 'u', 's', 'p', 'a'];
      if ((e.ctrlKey && teclas.includes(e.key.toLowerCase())) || (e.metaKey && teclas.includes(e.key.toLowerCase())) || e.key === 'F12') {
        e.preventDefault(); alert('📚 Función deshabilitada.'); return false;
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      cargarTema();
      cargarTamano();
      iniciarSesionGuardada();
    });
  </script>
</body>

</html>
